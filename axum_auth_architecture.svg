<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Axum Auth Backend Architecture - Production-Grade Template
  </text>
  
  <!-- Layer 1: Client -->
  <rect x="20" y="380" width="120" height="80" rx="10" fill="#ecf0f1" stroke="#3498db" stroke-width="2"/>
  <text x="80" y="405" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">HTTP Client</text>
  <text x="80" y="420" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">Frontend/Mobile</text>
  <text x="80" y="445" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">🌐</text>
  
  <!-- Layer 2: API Gateway -->
  <rect x="170" y="340" width="150" height="160" rx="10" fill="#e3f2fd" stroke="#3498db" stroke-width="3"/>
  <text x="245" y="360" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">Axum Framework</text>
  <text x="245" y="375" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Port 8000</text>
  <rect x="180" y="385" width="130" height="30" rx="5" fill="white" stroke="#3498db" stroke-width="1"/>
  <text x="245" y="403" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Routes Handler</text>
  <rect x="180" y="420" width="130" height="25" rx="5" fill="white" stroke="#3498db" stroke-width="1"/>
  <text x="245" y="436" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Request Validation</text>
  <rect x="180" y="450" width="130" height="25" rx="5" fill="white" stroke="#3498db" stroke-width="1"/>
  <text x="245" y="466" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Error Handling</text>
  
  <!-- Layer 3: Middleware -->
  <rect x="170" y="120" width="150" height="180" rx="10" fill="#ecf0f1" stroke="#95a5a6" stroke-width="3"/>
  <text x="245" y="140" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">Middleware Pipeline</text>
  <rect x="180" y="150" width="130" height="35" rx="5" fill="white" stroke="#27ae60" stroke-width="2"/>
  <text x="245" y="165" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Auth Middleware</text>
  <text x="245" y="178" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60">JWT Verification</text>
  <rect x="180" y="195" width="130" height="30" rx="5" fill="white" stroke="#95a5a6" stroke-width="1"/>
  <text x="245" y="213" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Logging Middleware</text>
  <rect x="180" y="230" width="130" height="35" rx="5" fill="white" stroke="#95a5a6" stroke-width="1"/>
  <text x="245" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">CORS &amp; Security</text>
  <text x="245" y="258" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">Headers</text>
  
  <!-- Layer 4: Auth Handlers -->
  <rect x="360" y="120" width="160" height="180" rx="10" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="440" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Auth Handlers</text>
  <text x="440" y="160" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60">Register</text>
  <text x="440" y="175" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60">Login</text>
  <text x="440" y="190" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60">Refresh Token</text>
  <text x="440" y="205" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60">Logout</text>
  <text x="440" y="220" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60">Email Verification</text>
  <text x="440" y="235" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60">Password Reset</text>
  
  <!-- Layer 4: User Handlers -->
  <rect x="360" y="320" width="160" height="130" rx="10" fill="#e3f2fd" stroke="#3498db" stroke-width="2"/>
  <text x="440" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">User Handlers</text>
  <text x="440" y="360" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#3498db">Get Current User</text>
  <text x="440" y="375" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#3498db">Update User</text>
  <text x="440" y="390" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#3498db">Delete User</text>
  <text x="440" y="405" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#3498db">Change Password</text>
  
  <!-- Layer 5: Auth Service -->
  <rect x="560" y="120" width="150" height="110" rx="10" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="635" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Auth Service</text>
  <text x="635" y="158" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Token Generation (JWT)</text>
  <text x="635" y="173" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Token Validation</text>
  <text x="635" y="188" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Session Management</text>
  <text x="635" y="203" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Password Hash (Argon2)</text>
  
  <!-- Layer 5: User Service -->
  <rect x="560" y="250" width="150" height="90" rx="10" fill="#e3f2fd" stroke="#3498db" stroke-width="2"/>
  <text x="635" y="270" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">User Service</text>
  <text x="635" y="288" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">User CRUD Operations</text>
  <text x="635" y="303" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Profile Management</text>
  <text x="635" y="318" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">User Validation</text>
  
  <!-- Layer 5: Email Service -->
  <rect x="560" y="360" width="150" height="90" rx="10" fill="#ffeaa7" stroke="#e67e22" stroke-width="2"/>
  <text x="635" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Email Service</text>
  <text x="635" y="398" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">SMTP Connection</text>
  <text x="635" y="413" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Email Templates</text>
  <text x="635" y="428" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Verification &amp; Reset</text>
  
  <!-- Layer 6: Database Layer -->
  <rect x="750" y="520" width="180" height="110" rx="10" fill="#f3e5f5" stroke="#9b59b6" stroke-width="2"/>
  <text x="840" y="540" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Database Layer (SQLx)</text>
  <text x="840" y="560" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Connection Pool</text>
  <text x="840" y="575" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Query Builders</text>
  <text x="840" y="590" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Migrations</text>
  <text x="840" y="605" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#9b59b6">Compile-time SQL Checks</text>
  
  <!-- Layer 7: PostgreSQL -->
  <ellipse cx="840" cy="710" rx="85" ry="30" fill="#f3e5f5" stroke="#9b59b6" stroke-width="2"/>
  <path d="M 755,710 Q 755,740 840,740 Q 925,740 925,710" fill="#e1bee7" stroke="#9b59b6" stroke-width="2"/>
  <line x1="755" y1="710" x2="755" y2="740" stroke="#9b59b6" stroke-width="2"/>
  <line x1="925" y1="710" x2="925" y2="740" stroke="#9b59b6" stroke-width="2"/>
  <text x="840" y="700" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">PostgreSQL</text>
  <text x="840" y="720" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">users, refresh_tokens</text>
  <text x="840" y="733" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">verification_tokens, reset_tokens</text>
  
  <!-- Layer 8: Utilities -->
  <rect x="970" y="120" width="150" height="150" rx="10" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
  <text x="1045" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Utility Modules</text>
  <text x="1045" y="160" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">JWT Utils</text>
  <text x="1045" y="173" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">(Sign/Verify)</text>
  <text x="1045" y="190" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Password Utils</text>
  <text x="1045" y="203" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">(Hash/Verify)</text>
  <text x="1045" y="220" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Validation Utils</text>
  <text x="1045" y="240" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Error Types</text>
  
  <!-- Key Features Panel -->
  <rect x="1160" y="120" width="220" height="150" rx="10" fill="#fff9c4" stroke="#f39c12" stroke-width="2"/>
  <text x="1270" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Key Features</text>
  <text x="1170" y="160" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">JWT Access &amp; Refresh Tokens</text>
  <text x="1170" y="177" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">Argon2 Password Hashing</text>
  <text x="1170" y="194" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">Email Verification Flow</text>
  <text x="1170" y="211" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">Password Reset Flow</text>
  <text x="1170" y="228" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">Role-Based Access Control</text>
  <text x="1170" y="245" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">SQLx Compile-time Checks</text>
  
  <!-- Security Panel -->
  <rect x="1160" y="290" width="220" height="140" rx="10" fill="#ffebee" stroke="#e74c3c" stroke-width="2"/>
  <text x="1270" y="310" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Security Layers</text>
  <text x="1170" y="330" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">HTTPS Ready</text>
  <text x="1170" y="347" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">CORS Protection</text>
  <text x="1170" y="364" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">SQL Injection Prevention</text>
  <text x="1170" y="381" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">XSS Protection</text>
  <text x="1170" y="398" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">Token Rotation</text>
  <text x="1170" y="415" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">Rate Limiting Ready</text>
  
  <!-- Tech Stack Panel -->
  <rect x="20" y="520" width="140" height="130" rx="10" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="90" y="540" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Tech Stack</text>
  <text x="90" y="560" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Axum + Tokio</text>
  <text x="90" y="577" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">PostgreSQL + SQLx</text>
  <text x="90" y="594" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">JWT + Argon2</text>
  <text x="90" y="611" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Lettre (SMTP)</text>
  <text x="90" y="628" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Serde + Validator</text>
  
  <!-- Example Flow Box -->
  <rect x="190" y="520" width="200" height="130" rx="10" fill="#e3f2fd" stroke="#3498db" stroke-width="2"/>
  <text x="290" y="540" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">Example Flow</text>
  <text x="205" y="560" font-family="Arial, sans-serif" font-size="8" text-anchor="start" fill="#2c3e50">POST /api/auth/login</text>
  <text x="205" y="575" font-family="Arial, sans-serif" font-size="8" text-anchor="start" fill="#2c3e50">→ Validation</text>
  <text x="205" y="590" font-family="Arial, sans-serif" font-size="8" text-anchor="start" fill="#2c3e50">→ Auth Handler</text>
  <text x="205" y="605" font-family="Arial, sans-serif" font-size="8" text-anchor="start" fill="#2c3e50">→ Auth Service</text>
  <text x="205" y="620" font-family="Arial, sans-serif" font-size="8" text-anchor="start" fill="#2c3e50">→ Database Query</text>
  <text x="205" y="635" font-family="Arial, sans-serif" font-size="8" text-anchor="start" fill="#3498db">← 200 OK + JWT</text>
  
  <!-- Arrows -->
  <polygon points="140,420 170,420 165,415 165,425" fill="#3498db"/>
  <line x1="140" y1="420" x2="165" y2="420" stroke="#3498db" stroke-width="2"/>
  
  <polygon points="320,210 360,210 355,205 355,215" fill="#3498db"/>
  <line x1="320" y1="210" x2="355" y2="210" stroke="#3498db" stroke-width="2"/>
  
  <polygon points="245,340 245,300 240,305 250,305" fill="#95a5a6"/>
  <line x1="245" y1="340" x2="245" y2="305" stroke="#95a5a6" stroke-width="2"/>
  
  <polygon points="520,175 560,175 555,170 555,180" fill="#27ae60"/>
  <line x1="520" y1="175" x2="555" y2="175" stroke="#27ae60" stroke-width="2"/>
  
  <polygon points="520,295 560,295 555,290 555,300" fill="#3498db"/>
  <line x1="520" y1="295" x2="555" y2="295" stroke="#3498db" stroke-width="2"/>
  
  <polygon points="560,405 520,385 525,390 525,380" fill="#e67e22"/>
  <line x1="520" y1="385" x2="555" y2="405" stroke="#e67e22" stroke-width="2"/>
  
  <polygon points="780,520 710,200 705,205 715,205" fill="#9b59b6"/>
  <line x1="710" y1="200" x2="775" y2="515" stroke="#9b59b6" stroke-width="2"/>
  
  <polygon points="780,520 710,295 705,300 715,300" fill="#9b59b6"/>
  <line x1="710" y1="295" x2="775" y2="515" stroke="#9b59b6" stroke-width="2"/>
  
  <polygon points="840,680 840,630 835,635 845,635" fill="#9b59b6"/>
  <line x1="840" y1="630" x2="840" y2="675" stroke="#9b59b6" stroke-width="2"/>
  
  <!-- Dotted lines to utilities -->
  <line x1="710" y1="175" x2="970" y2="175" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="710" y1="195" x2="970" y2="210" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Email to SMTP -->
  <rect x="770" y="465" width="90" height="30" rx="5" fill="#ffeaa7" stroke="#e67e22" stroke-width="1"/>
  <text x="815" y="483" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">SMTP Server</text>
  <path d="M 710,405 Q 750,405 750,465" stroke="#e67e22" stroke-width="2" fill="none"/>
  <polygon points="750,465 750,455 745,460 755,460" fill="#e67e22"/>
  
  <!-- Response arrow -->
  <path d="M 170,460 Q 150,470 150,440" stroke="#3498db" stroke-width="2" fill="none"/>
  <polygon points="150,440 150,450 145,445 155,445" fill="#3498db"/>
  
  <!-- Annotations -->
  <text x="245" y="320" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d" font-style="italic">Protected routes require valid JWT</text>
  <text x="635" y="250" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d" font-style="italic">Access: 1hr | Refresh: 7 days</text>
  <text x="840" y="655" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d" font-style="italic">Compile-time SQL verification</text>
  <text x="635" y="470" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d" font-style="italic">Async SMTP email sending</text>
  
  <!-- Legend -->
  <text x="420" y="690" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#2c3e50">Legend:</text>
  <rect x="420" y="700" width="30" height="15" rx="3" fill="#e3f2fd" stroke="#3498db" stroke-width="1"/>
  <text x="455" y="711" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">HTTP/API Layer</text>
  <rect x="560" y="700" width="30" height="15" rx="3" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="595" y="711" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">Authentication</text>
  <rect x="420" y="720" width="30" height="15" rx="3" fill="#f3e5f5" stroke="#9b59b6" stroke-width="1"/>
  <text x="455" y="731" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">Database</text>
  <rect x="560" y="720" width="30" height="15" rx="3" fill="#ffeaa7" stroke="#e67e22" stroke-width="1"/>
  <text x="595" y="731" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">External Services</text>
  <rect x="700" y="720" width="30" height="15" rx="3" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
  <text x="735" y="731" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="#2c3e50">Middleware/Utils</text>
  
  <!-- Footer -->
  <text x="700" y="875" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d" font-style="italic">Clean Architecture - Type-Safe - Production-Ready - Built with Rust</text>
</svg>
